# spec_template.yaml
# Extraction Output Template for Run A — Spec Extraction
# Version: v1
# This file is loaded at startup and passed (minus RUN_C_CALCULATED_FIELDS)
# to the Gemini LLM as the output structure guide.
#
# Units: INR | mm | grams | GB | GHz | degrees C | ISO 8601 dates
# DO NOT MODIFY field paths without updating field_mapping.py accordingly.

extraction_task:
  target_entity: "Mobile Phone"
  schema: "mobile_specs (PostgreSQL)"
  instructions: |
    Extract ALL available specifications for the phone described in the input sources.
    For fields that use lookups (marked <- lookup), output the EXACT string value from
    the allowed values list. For junction table arrays (marked <- junction), output a
    list of exact string values from the allowed values. Use null for missing or unknown
    fields — never guess. All prices in INR. All dimensions in mm. Weight in grams.
    Memory in GB. Dates in ISO 8601 (YYYY-MM-DD).

  source_priority: |
    When the same field appears in multiple sources and values conflict, resolve:
      1st (wins) — OEM official site: always authoritative on hardware specs
      2nd        — YouTube transcript: reliable for charger-in-box, in-box contents,
                   India-specific features and variants
      3rd        — Aggregator sites (GSMArena, Smartprix): used when OEM and
                   transcript are both silent on a field
    EXCEPTION: For numeric precision fields (resolution_px, battery_capacity,
    exact mm dimensions (height/width/thickness), megapixels) prefer aggregator values over transcript —
    transcripts round and approximate.

  derived_fields_do_not_extract: |
    STRICTLY FORBIDDEN — these are computed by Run C, never by the LLM:
      - displays[*].ppi            -> computed: sqrt(h²+w²) / size_inch
      - camera_lenses[*].sensor_size_decimal -> computed: 1.0 / sensor_size_denominator

# Output structure — see extraction_templates_v3.md for full field documentation
