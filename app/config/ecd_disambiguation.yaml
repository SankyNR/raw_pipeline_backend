# ecd_disambiguation.yaml
# Injected into the ECD on every extraction run.
# Contains: source priority block + cross-table disambiguation rules.
# DO NOT edit field paths here without updating field_mapping.py accordingly.

source_priority:
  description: >
    When the same field appears in multiple source documents and values conflict,
    resolve using this priority order. The SOURCE DOCUMENT SECTIONS are labelled
    in the combined input content with "--- SOURCE: {site_name} (raw_id=...) ---".
  order:
    - source: OEM official site
      priority: 1
      trust_reason: >
        Direct manufacturer specification. Authoritative on all hardware specs.
        Use regardless of what other sources say.

    - source: YouTube transcript
      priority: 2
      trust_reason: >
        Indian market reviewer with physical device. Reliable for charger_in_box,
        in_the_box contents, India-specific variants and colour availability.
      exceptions:
        fields_where_aggregator_wins:
          - "displays[*].resolution_height_px"
          - "displays[*].resolution_width_px"
          - "charging.battery_capacity"
          - "camera_lenses[*].megapixels"
          - "body.height"
          - "body.width"
          - "body.thickness"
          - "body.weight"
          - "network.bands_5g"
          - "network.bands_4g"
        reason: Transcripts approximate spoken numbers. Aggregators have exact figures from spec sheets.

    - source: Aggregator site (GSMArena, Smartprix)
      priority: 3
      trust_reason: >
        Comprehensive spec coverage but may reflect global/EU specs, not India retail unit.
        Use as fallback when OEM and transcript are both silent.

disambiguation_rules:
  - rule: "Dolby Atmos"
    note: >
      Dolby Atmos applies to three contexts simultaneously — do NOT deduplicate across them:
      speaker output (audio.audio_codecs), display HDR (displays[*].display_features),
      and video recording (camera_features).
    applies_to:
      - path: audio.audio_codecs
        context: "Speaker output / playback — the phone's speakers support Dolby Atmos"
      - path: "displays[*].display_features"
        context: "Display HDR — the screen can display Dolby Atmos HDR content"
      - path: camera_features
        context: "Video recording — the camera records Dolby Atmos audio (Change 1a: moved from per-lens)"

  - rule: "LTPO"
    note: >
      LTPO is both a panel technology (displays[*].panel_type, e.g. "LTPO3 AMOLED")
      and a display capability flag (displays[*].display_features, add "LTPO"). Populate both.
    applies_to:
      - path: "displays[*].panel_type"
        context: "The panel technology itself — e.g. LTPO3 AMOLED, LTPO4 AMOLED"
      - path: "displays[*].display_features"
        context: "Adaptive refresh rate capability flag — add 'LTPO' or 'Adaptive Refresh Rate'"

  - rule: "OIS (Optical Image Stabilisation)"
    note: >
      OIS applies at two levels: per-lens (camera_lenses[*].stabilization)
      and phone-level (camera_features). Populate both.
    applies_to:
      - path: "camera_lenses[*].stabilization"
        context: "Per-lens stabilisation type for the specific lens that has OIS"
      - path: camera_features
        context: "General camera system feature — the camera system supports OIS (Change 1a: moved from per-lens)"

  - rule: "Samsung App Lock"
    maps_to: "os_and_security.security_features"
    canonical_value: "Secure Folder"
    note: For Samsung phones, App Lock functionality lives inside Secure Folder. Map to "Secure Folder".

  - rule: "Wi-Fi calling / VoWiFi"
    maps_to: "connectivity.wifi_technologies"
    note: Wi-Fi Calling goes under connectivity.wifi_technologies, not network.

  - rule: "5G SA vs NSA"
    maps_to: "network.bands_5g"
    note: >
      SA/NSA are not band names — put them in network.cellular_features.
      bands_5g contains only actual band names (n28, n78, etc.).

  - rule: "USB features vs USB standard"
    note: usb_standard = USB version (e.g. USB 3.2 Gen 2). usb_features = capabilities (OTG, DisplayPort). Different fields.

  - rule: "Bluetooth profiles vs version"
    note: bluetooth_version = version string only (e.g. "5.4"). Do not include profile names (A2DP, LE Audio).

  # ---------------------------------------------------------------------------
  # Change 4 — added 2026-05-07
  # ---------------------------------------------------------------------------

  - rule: "SIM configuration and eSIM support"
    note: >
      OEM India site is authoritative. GSMArena may show global eSIM variants not sold in India.
      If OEM India shows Dual Nano-SIM only → esim_support=false, sim_configuration="Dual SIM (Nano-SIM, dual stand-by)".
      Silence on eSIM = false. See also rule 5p.
    applies_to:
      - path: network.esim_support
      - path: network.sim_configuration
      - path: network.number_of_sims

  - rule: "Wireless charging — India variants"
    note: >
      OEM India site is authoritative. Some phones support wireless charging globally but not in India.
      If OEM India is silent on wireless charging → wireless_charging=false.
    applies_to:
      - path: charging.wireless_charging
      - path: charging.wireless_charging_power
      - path: charging.wireless_charging_standard

  - rule: "Phone variants — India vs global"
    note: >
      OEM India site only. GSMArena lists global tiers not sold in India.
      Output exactly the variants listed on the India OEM page — no more, no less.
    applies_to:
      - path: "variants[*]"


  - rule: "Camera features — phone-level not per-lens"
    note: >
      camera_features is a TOP-LEVEL root field. Collect from all lenses and sources into one
      deduplicated list. Use only lookup canonical names. Never assign inside camera_lenses[*].
    applies_to:
      - path: camera_features

  - rule: "Video resolution normalization"
    note: >
      Normalize: UHD = 4K | FHD = 1080p | HD = 720p. Combine same res+fps entries
      that differ only in aspect ratio. Highest resolution first.
    applies_to:
      - path: video_capabilities.rear_video_resolutions
      - path: video_capabilities.front_video_resolutions

  - rule: "Benchmark score rounding and verbal conversion"
    note: >
      Convert verbal to integer first ("around 2 million" = 2000000).
      Average multiple sources then round: AnTuTu nearest 100k | Geekbench nearest 100 | 3DMark nearest 10.
      Record version (v9/v10, v5/v6) when available.
    applies_to:
      - path: performance_benchmarks.antutu_score
      - path: performance_benchmarks.geekbench_single_core
      - path: performance_benchmarks.geekbench_multi_core
      - path: performance_benchmarks.three_d_mark_score

  # ---------------------------------------------------------------------------
  # Change E — added 2026-05-09
  # ---------------------------------------------------------------------------

  - rule: "VoNR / Vo5G / Voice over 5G terminology"
    note: >
      All map to network.vo5g = true: "VoNR" | "Vo5G" | "Voice over 5G NR" | "Voice over 5G" | "VNR" | "supports vnr".
      5G support alone does NOT imply vo5g. volte and vowifi are separate fields.
    applies_to:
      - path: network.vo5g

